<!doctype html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>AgentCalc</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 640px;
            margin: 40px auto;
            padding: 0 16px;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 8px;
            font-size: 16px;
        }

        button {
            padding: 8px 16px;
            font-size: 16px;
        }

        #answer {
            margin-top: 24px;
        }

        .step {
            background: #f4f4f4;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px;
        }

            .step.final {
                background: #e6f2ff;
            }

        .title {
            font-weight: bold;
            margin-bottom: 4px;
        }

        .muted {
            color: #555;
        }
    </style>
</head>
<body>
    <h2>AgentCalc</h2>
    <form id="f">
        <input id="q" placeholder="Örn: 8 ile 3'ü çarp, sonra 2 ile topla" autocomplete="off" required>
        <button id="send">Gönder</button>
    </form>
    <div id="answer"></div>

    <script>
        const form = document.getElementById("f");
        const input = document.getElementById("q");
        const answer = document.getElementById("answer");
        const button = document.getElementById("send");

        function el(tag, text, cls) {
            const e = document.createElement(tag);
            e.textContent = text;
            if (cls) e.className = cls;
            return e;
        }

        function render(data) {
            answer.innerHTML = "";
            for (const s of data.steps) {
                if (s.type === "tool") {
                    // mevcut kod aynen kalsın
                } else if (s.type === "pending") {
                    const box = el("div", "", "step");
                    box.append(el("div", `Tur ${s.turn}: onay bekliyor → ${s.name}`, "title"));
                    box.append(el("div", `girdi: ${s.args}`, "muted"));
                    const btn = el("button", "Onayla");
                    const out = el("div", "", "muted");
                    btn.addEventListener("click", async () => {
                        btn.disabled = true;
                        const r = await fetch("/onayla?id=" + encodeURIComponent(s.id));
                        out.textContent = "sonuç: " + (await r.text());
                    });
                    box.append(btn, out);
                    answer.append(box);
                } else {
                    const box = el("div", "", "step final");
                    box.append(el("div", `Tur ${s.turn}: nihai cevap`, "title"));
                    box.append(el("div", s.text));
                    answer.append(box);
                }
            }
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;

            button.disabled = true;
            answer.textContent = "Düşünüyor...";
            try {
                const res = await fetch("/agent?q=" + encodeURIComponent(q));
                if (!res.ok) throw new Error("HTTP " + res.status);
                render(await res.json());
            } catch (err) {
                answer.textContent = "Hata: " + err.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
